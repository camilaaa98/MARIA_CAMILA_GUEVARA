<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Test Creación Programa</title>
</head>

<body>
    <h1>Test de Creación de Programa/Ficha</h1>
    <button onclick="testCrear()">Probar Crear Programa</button>
    <div id="resultado" style="margin-top: 20px; padding: 20px; border: 1px solid #ccc;"></div>

    <script>
        async function testCrear() {
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = 'Enviando solicitud...';

            const formData = {
                numeroFicha: '8888888',
                nombrePrograma: 'Test Directo del Sistema',
                nivel Formacion: 'Tecnólogo',
                jornada: 'Mixta',
                estado: 'En Formación'
            };

            try {
                console.log('Datos a enviar:', formData);

                const response = await fetch('/YanguasEjercicios/mockups-asist-net/api/crear-programa-ficha.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                console.log('Status HTTP:', response.status);
                console.log('Headers:', response.headers);

                const text = await response.text();
                console.log('Respuesta raw:', text);

                const result = JSON.parse(text);
                console.log('Respuesta JSON:', result);

                resultado.innerHTML = `
                <h3>Resultado:</h3>
                <p><strong>Status:</strong> ${response.status}</p>
                <p><strong>Success:</strong> ${result.success}</p>
                <p><strong>Message:</strong> ${result.message}</p>
                <p><strong>Programa Nuevo:</strong> ${result.programa_nuevo}</p>
                <pre>${JSON.stringify(result, null, 2)}</pre>
            `;

            } catch (error) {
                console.error('Error:', error);
                resultado.innerHTML = `
                <h3 style="color: red;">Error:</h3>
                <p>${error.message}</p>
                <pre>${error.stack}</pre>
            `;
            }
        }
    </script>
</body>

</html>
