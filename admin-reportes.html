<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Reportes - AsistNet</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="sidebar-logo-svg">
                            <path fill="currentColor" d="M100 40L160 70V130L100 160L40 130V70L100 40Z" />
                            <circle cx="100" cy="100" r="25" fill="currentColor" />
                        </svg>
                    </div>
                    <div>
                        <div class="sidebar-title">AsistNet</div>
                        <div class="sidebar-subtitle">Administrador</div>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button onclick="window.location.href='admin-dashboard.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span>Panel Principal</span>
                </button>
                <button onclick="window.location.href='admin-aprendices.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <span>Gestionar Aprendices</span>
                </button>
                <button onclick="window.location.href='admin-programas.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    <span>Gestionar Programas</span>
                </button>
                <button onclick="window.location.href='admin-fichas.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    <span>Gestionar Fichas</span>
                </button>
                <button onclick="window.location.href='admin-asistencias.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    <span>Consultar Asistencias</span>
                </button>
                <button onclick="window.location.href='admin-reportes.html'" class="nav-item active">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span>Generar Reportes</span>
                </button>
                <button onclick="window.location.href='admin-usuarios.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span>Registrar Usuario</span>
                </button>
                <button onclick="authSystem.logout()" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    <span>Cerrar Sesión</span>
                </button>
            </nav>

            <!-- Logo SENA circular al final del sidebar -->
            <div class="sidebar-footer">
                <img src="logosena.png" alt="Logo SENA" class="sidebar-sena-logo">
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header" style="text-align: center;">
                <h1 class="content-title">Reportes y Estadísticas</h1>
                <p class="content-description">Visualización de datos y generación de informes</p>
            </div>

            <!-- Formulario de generación de reportes -->
            <div class="table-container animate-slide-in">
                <div class="table-header">
                    <h2 class="table-title">Configurar Reporte</h2>
                </div>
                <form id="formReporte" onsubmit="generarReporte(event)" style="padding: 2rem;">
                    <div
                        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
                        <div class="form-group">
                            <label for="tipoReporte">Tipo de Reporte</label>
                            <select id="tipoReporte" required>
                                <option value="">Seleccione...</option>
                                <option value="general">Asistencia General</option>
                                <option value="ficha">Por Ficha</option>
                                <option value="aprendiz">Por Aprendiz</option>
                                <option value="instructor">Por Instructor</option>
                                <option value="programa">Por Programa</option>
                            </select>
                        </div>
                        <div id="contenedorBusqueda">
                            <!-- Se llenará dinámicamente según tipo -->
                        </div>
                        <div class="form-group">
                            <label for="reporteFechaInicio">Fecha Inicio</label>
                            <input type="date" id="reporteFechaInicio" required onchange="validarFechasReporte()">
                        </div>
                        <div class="form-group">
                            <label for="reporteFechaFin">Fecha Fin</label>
                            <input type="date" id="reporteFechaFin" required onchange="validarFechasReporte()">
                        </div>
                        <div class="form-group">
                            <label for="formatoReporte">Formato</label>
                            <select id="formatoReporte" required>
                                <option value="pdf">PDF</option>
                                <option value="excel">Excel</option>
                                <option value="csv">CSV</option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-top: 2rem; display: flex; gap: 2rem; justify-content: center;">
                        <button type="submit" class="btn btn-primary btn-sm">
                            <svg style="width: 16px; height: 16px; margin-right: 0.5rem;" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            Generar Reporte
                        </button>
                        <button type="button" onclick="previsualizarReporte()" class="btn btn-secondary btn-sm">
                            <svg style="width: 16px; height: 16px; margin-right: 0.5rem;" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            Previsualizar
                        </button>
                    </div>
                </form>
            </div>

            <!-- Previsualización del reporte -->
            <div id="previsualizacion" class="table-container animate-slide-in"
                style="animation-delay: 0.2s; display: none;">
                <div class="table-header">
                    <h2 class="table-title">Previsualización del Reporte</h2>
                </div>
                <div id="contenidoPrevia" style="padding: 2rem;">
                    <!-- Se llenará dinámicamente -->
                </div>
            </div>

            <!-- Historial de reportes generados -->
            <div class="table-container animate-slide-in" style="animation-delay: 0.3s;">
                <div class="table-header">
                    <h2 class="table-title">Historial de Reportes</h2>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha Generación</th>
                                <th>Tipo</th>
                                <th>Periodo</th>
                                <th>Formato</th>
                                <th>Generado Por</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="historialReportes">
                            <!-- Se llenará dinámicamente -->
                            <tr>
                                <td colspan="6" style="text-align: center; color: #666;">No hay reportes generados</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/shared/auth.js"></script>
    <script src="js/admin/reportes.js"></script>
    <script>
        if (!authSystem.isAuthenticated() || authSystem.getCurrentUser().role !== 'admin') {
            window.location.href = 'index.html';
        }

        // Validación de fechas
        function validarFechasReporte() {
            const fechaInicio = document.getElementById('reporteFechaInicio');
            const fechaFin = document.getElementById('reporteFechaFin');
            const hoy = new Date().toISOString().split('T')[0];

            // Establecer max date a hoy
            fechaInicio.setAttribute('max', hoy);
            fechaFin.setAttribute('max', hoy);

            if (fechaInicio.value && fechaInicio.value > hoy) {
                alert('La fecha de inicio no puede ser futura');
                fechaInicio.value = '';
                return;
            }

            if (fechaFin.value && fechaFin.value > hoy) {
                alert('La fecha fin no puede ser futura');
                fechaFin.value = '';
                return;
            }

            if (fechaInicio.value && fechaFin.value) {
                if (new Date(fechaFin.value) < new Date(fechaInicio.value)) {
                    alert('La fecha fin no puede ser anterior a la fecha de inicio');
                    fechaFin.value = '';
                }
            }
        }

        // Inicializar max date al cargar
        document.addEventListener('DOMContentLoaded', () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('reporteFechaInicio').setAttribute('max', hoy);
            document.getElementById('reporteFechaFin').setAttribute('max', hoy);
        });
    </script>
</body>

</html>
