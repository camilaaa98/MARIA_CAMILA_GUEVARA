<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Fichas - AsistNet</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="sidebar-logo-svg">
                            <path fill="currentColor" d="M100 40L160 70V130L100 160L40 130V70L100 40Z" />
                            <circle cx="100" cy="100" r="25" fill="currentColor" />
                        </svg>
                    </div>
                    <div>
                        <div class="sidebar-title">AsistNet</div>
                        <div class="sidebar-subtitle">Administrador</div>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button onclick="window.location.href='admin-dashboard.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span>Panel Principal</span>
                </button>
                <button onclick="window.location.href='admin-aprendices.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <span>Gestionar Aprendices</span>
                </button>
                <button onclick="window.location.href='admin-programas.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    <span>Gestionar Programas</span>
                </button>
                <button onclick="window.location.href='admin-fichas.html'" class="nav-item active">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    <span>Gestionar Fichas</span>
                </button>
                <button onclick="window.location.href='admin-asistencias.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    <span>Consultar Asistencias</span>
                </button>
                <button onclick="window.location.href='admin-reportes.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span>Generar Reportes</span>
                </button>
                <button onclick="window.location.href='admin-usuarios.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span>Registrar Usuario</span>
                </button>
                <button onclick="authSystem.logout()" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    <span>Cerrar Sesión</span>
                </button>
            </nav>

            <!-- Logo SENA circular al final del sidebar -->
            <div class="sidebar-footer">
                <img src="logosena.png" alt="Logo SENA" class="sidebar-sena-logo">
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header" style="text-align: center;">
                <h1 class="content-title">Gestión de Fichas</h1>
                <p class="content-description">Administración de fichas de formación</p>
            </div>

            <!-- Tabla de Fichas -->
            <div class="table-container animate-slide-in">
                <div class="table-header">
                    <h2 class="table-title">Lista de Fichas</h2>
                    <div class="table-actions">
                        <input type="text" id="busquedaFicha" placeholder="Buscar ficha..."
                            style="padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; width: 200px; margin-right: 10px;"
                            oninput="filtrarFichas(this.value)">
                        <button class="btn btn-primary btn-sm" onclick="nuevaFicha()">+ Nueva Ficha</button>
                        <button class="btn btn-sm" onclick="exportarFichas()"
                            style="background: var(--muted); color: var(--foreground);">Exportar</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Ficha</th>
                                <th>Programa</th>
                                <th>Instructor</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaFichas">
                            <!-- Se llenará dinámicamente -->
                        </tbody>
                    </table>
                </div>
                <!-- Controles de Paginación -->
                <div class="pagination-controls"
                    style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px;">
                    <button id="prevBtnFichas" class="btn btn-sm">Anterior</button>
                    <span id="pageInfoFichas">Página 1</span>
                    <button id="nextBtnFichas" class="btn btn-sm">Siguiente</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para nueva ficha -->
    <div id="modalFicha" class="modal">
        <div class="modal-content animate-scale-in">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Ficha</h3>
                <button onclick="cerrarModal()" class="btn-close">&times;</button>
            </div>
            <form id="formFicha" onsubmit="guardarFicha(event)">
                <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="numeroFicha">Número de Ficha *</label>
                        <input type="text" id="numeroFicha" required pattern="[0-9]+" title="Solo números"
                            placeholder="Ej: 2558934" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>
                    <div class="form-group">
                        <label for="programaFicha">Programa de Formación *</label>
                        <input list="listaProgramas" id="programaFicha" required class="form-control"
                            placeholder="Escriba o seleccione..."
                            style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                        <datalist id="listaProgramas">
                            <!-- Se llenará dinámicamente -->
                        </datalist>
                    </div>
                    <div class="form-group">
                        <label for="estadoFicha">Estado *</label>
                        <select id="estadoFicha" required>
                            <option value="Activa">Activa</option>
                            <option value="Inactiva">Inactiva</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer" style="margin-top: 1.5rem;">
                    <button type="button" onclick="cerrarModal()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Ficha</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Asignar Instructor -->
    <div id="modalInstructor" class="modal">
        <div class="modal-content animate-scale-in">
            <div class="modal-header">
                <h3 id="modalTitleInstructor">Asignar Instructores</h3>
                <button onclick="cerrarModalInstructor()" class="btn-close">&times;</button>
            </div>
            <form id="formAsignarInstructor" onsubmit="guardarAsignacionInstructor(event)">
                <input type="hidden" id="fichaAsignacion">
                <div class="form-group">
                    <label>Ficha Seleccionada</label>
                    <input type="text" id="fichaDisplay" readonly style="background-color: #f3f4f6;">
                </div>
                <div class="form-group">
                    <label for="instructorSelect">Seleccionar Instructor</label>
                    <select id="instructorSelect" required>
                        <option value="">Seleccione un instructor...</option>
                        <!-- Se llenará dinámicamente -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Instructores Asignados Actuales</label>
                    <div id="listaInstructoresAsignados"
                        style="padding: 10px; border: 1px solid #ddd; border-radius: 4px; min-height: 50px;">
                        <span style="color: #666; font-style: italic;">Ninguno asignado</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="cerrarModalInstructor()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Asignar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/shared/auth.js"></script>
    <script src="js/admin/fichas-v2.js"></script>
    <script>
        if (!authSystem.isAuthenticated() || authSystem.getCurrentUser().role !== 'admin') {
            window.location.href = 'index.html';
        }


        // Conectar botones
        // Los eventos onclick ya están definidos en el HTML
    </script>
</body>

</html>
