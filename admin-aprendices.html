        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header" style="text-align: center;">
                <h1 class="content-title">Gestión de Aprendices</h1>
                <p class="content-description">Administración de aprendices y matrículas</p>
            </div>

            <!-- Modal para Nuevo/Editar Aprendiz -->
            <div id="modalAprendiz" class="modal">
                <div class="modal-content" style="max-width: 800px;">
                    <div class="modal-header">
                        <h3 id="modalTitle">Nuevo Aprendiz</h3>
                        <button onclick="cerrarModalAprendiz()" class="btn-close">&times;</button>
                    </div>
                    <form id="formAprendiz" onsubmit="guardarAprendiz(event)">
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                            <div class="form-group">
                                <label for="tipoDocumento">Tipo de Documento *</label>
                                <select id="tipoDocumento" required>
                                    <option value="">Seleccione...</option>
                                    <option value="CC">Cédula de Ciudadanía (CC)</option>
                                    <option value="TI">Tarjeta de Identidad (TI)</option>
                                    <option value="RC">Registro Civil</option>
                                    <option value="PT">Permiso de Trabajo</option>
                                    <option value="CE">Cédula Extranjera</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="documento">Número de Documento *</label>
                                <input type="text" id="documento" required pattern="[0-9]+"
                                    title="Solo números, sin puntos ni comas" placeholder="Ej: 1234567890"
                                    oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            </div>
                            <div class="form-group">
                                <label for="nombre">Nombre *</label>
                                <input type="text" id="nombre" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
                                    title="Solo letras" placeholder="Ej: Juan Carlos"
                                    oninput="this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ\s]/g, '')">
                            </div>
                            <div class="form-group">
                                <label for="apellido">Apellido *</label>
                                <input type="text" id="apellido" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
                                    title="Solo letras" placeholder="Ej: Pérez García"
                                    oninput="this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ\s]/g, '')">
                            </div>
                            <div class="form-group">
                                <label for="celular">Celular</label>
                                <input type="text" id="celular" pattern="[0-9]{10}" maxlength="10"
                                    title="10 dígitos numéricos" placeholder="Ej: 3001234567"
                                    oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            </div>
                            <div class="form-group">
                                <label for="correo">Correo Electrónico</label>
                                <input type="email" id="correo" placeholder="ejemplo@sena.edu.co">
                            </div>
                            <div class="form-group">
                                <label for="fichaAprendiz">Ficha *</label>
                                <input list="fichasList" id="fichaAprendiz" required class="form-control"
                                    placeholder="Buscar ficha..."
                                    style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                                <datalist id="fichasList">
                                    <!-- Se llenará dinámicamente -->
                                </datalist>
                            </div>
                            <div class="form-group">
                                <label for="estadoAprendiz">Estado *</label>
                                <select id="estadoAprendiz" required>
                                    <option value="">Seleccione...</option>
                                    <option value="En Formación">En Formación</option>
                                    <option value="Retiro Voluntario">Retiro Voluntario</option>
                                    <option value="Cancelado">Cancelado</option>
                                    <option value="Comite">Comite</option>
                                    <option value="Desertado">Desertado</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer" style="margin-top: 1.5rem;">
                            <button type="button" onclick="cerrarModalAprendiz()"
                                class="btn btn-secondary">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar Aprendiz</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Aprendices Table -->
            <div class="table-container animate-slide-in">
                <div class="table-header">
                    <h2 class="table-title">Lista de Aprendices</h2>
                    <div class="table-actions">
                        <input type="text" id="busquedaAprendiz" placeholder="Buscar aprendiz..."
                            style="padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; margin-right: 10px;"
                            oninput="filtrarAprendices(this.value)">
                        <button class="btn btn-primary btn-sm" onclick="nuevoAprendiz()">+ Nuevo Aprendiz</button>
                        <button class="btn btn-sm" onclick="exportarAprendices()"
                            style="background: var(--muted); color: var(--foreground);">Exportar</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <!-- ID eliminado -->
                                <th>Nombre</th>
                                <th>Documento</th>
                                <th>Ficha</th>
                                <th>Programa</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>
                <!-- Controles de Paginación -->
                <div class="pagination-controls"
                    style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px;">
                    <button id="prevBtn" class="btn btn-sm">Anterior</button>
                    <span id="pageInfo">Página 1</span>
                    <button id="nextBtn" class="btn btn-sm">Siguiente</button>
                </div>
            </div>
    </div>
    </main>
    </div>

    <script src="js/shared/auth.js"></script>
    <script src="js/admin/aprendices.js"></script>
    <script>
        if (!authSystem.isAuthenticated() || authSystem.getCurrentUser().role !== 'admin') {
            window.location.href = 'index.html';
        }

        // Conectar botones
        document.querySelector('.btn-primary').onclick = nuevoAprendiz;
        document.querySelectorAll('.btn-sm')[1].onclick = exportarAprendices;
    </script>
</body>

</html>
