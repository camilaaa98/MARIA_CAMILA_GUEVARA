<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Asistencia - AsistNet</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/biometria.css">
    <!-- Face-API.js para reconocimiento facial real -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="sidebar-logo-svg">
                            <path fill="currentColor" d="M100 40L160 70V130L100 160L40 130V70L100 40Z" />
                            <circle cx="100" cy="100" r="25" fill="currentColor" />
                        </svg>
                    </div>
                    <div>
                        <div class="sidebar-title">AsistNet</div>
                        <div class="sidebar-subtitle">Instructor</div>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button onclick="window.location.href='instructor-dashboard.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span>Panel Principal</span>
                </button>
                <button onclick="window.location.href='instructor-registrar.html'" class="nav-item active">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                    <span>Registrar Asistencia</span>
                </button>
                <button onclick="window.location.href='instructor-asistencias.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    <span>Consultar Asistencias</span>
                </button>
                <button onclick="window.location.href='instructor-reportes.html'" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span>Generar Reportes</span>
                </button>
                <button onclick="authSystem.logout()" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    <span>Cerrar Sesión</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header" style="text-align: center;">
                <h1 class="content-title">Registrar Asistencia</h1>
                <p class="content-description">Registro diario de asistencia de aprendices</p>
            </div>

            <!-- Selección de ficha -->
            <div class="table-container animate-slide-in">
                <div class="table-header">
                    <h2 class="table-title">Seleccionar Ficha</h2>
                </div>
                <div style="padding: 1.5rem;">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                        <div class="form-group">
                            <label for="fichaSeleccionada">Ficha</label>
                            <select id="fichaSeleccionada" onchange="cargarAprendices()" required>
                                <option value="">Seleccione una ficha...</option>
                                <!-- Las opciones se cargarán dinámicamente -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="fechaAsistencia">Fecha</label>
                            <input type="date" id="fechaAsistencia" required readonly
                                style="background-color: #f5f5f5; cursor: not-allowed;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista de asistencia -->
            <div id="contenedorAsistencia" class="table-container animate-slide-in"
                style="animation-delay: 0.2s; display: none;">
                <div class="table-header">
                    <h2 class="table-title">Lista de Asistencia</h2>
                    <div class="table-actions">
                        <button onclick="marcarTodos(true)" class="btn btn-sm"
                            style="background: #10B981; color: white;">Marcar Todos</button>
                        <button onclick="marcarTodos(false)" class="btn btn-sm"
                            style="background: #EF4444; color: white;">Desmarcar Todos</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre Completo</th>
                                <th>Documento</th>
                                <th style="text-align: center;">Biometría</th>
                                <th style="text-align: center;">Asistencia</th>
                                <th>Observaciones</th>
                                <th style="text-align: center;">Soporte</th>
                            </tr>
                        </thead>
                        <tbody id="tablaAsistenciaAprendices">
                            <!-- Se llenará dinámicamente -->
                        </tbody>
                    </table>
                </div>
                <div style="padding: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;">
                    <button onclick="cancelarAsistencia()" class="btn btn-secondary">Cancelar</button>
                    <button onclick="guardarAsistencia()" class="btn btn-primary">Guardar Asistencia</button>
                </div>
            </div>
        </main>
    </div>

    <script src="js/shared/auth.js"></script>
    <script src="js/instructor/biometria-facial.js"></script>
    <script src="js/instructor/instructor-registrar.js"></script>
    <script>
        if (!authSystem.isAuthenticated() || authSystem.getCurrentUser().role !== 'instructor') {
            window.location.href = 'index.html';
        }
        // Establecer fecha actual por defecto
        document.getElementById('fechaAsistencia').valueAsDate = new Date();
    </script>
</body>

</html>
